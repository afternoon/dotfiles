theme = "onedarker"

[editor]
color-modes = true
end-of-line-diagnostics = "hint"
trim-trailing-whitespace = true

[editor.auto-save]
focus-lost = true
after-delay.enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"

[editor.file-picker]
hidden = false

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-inlay-hints = false
